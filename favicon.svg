<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="nexusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Base Plate -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#070e1b" stroke="url(#nexusGrad)" stroke-width="3.5" />

  <!-- Circuit Micro Pins -->
  <path d="M64 8 V20 M64 108 V120 M8 64 H20 M108 64 H120" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Corner Accents -->
  <circle cx="28" cy="28" r="3" fill="#00f2fe" opacity="0.8"/>
  <circle cx="100" cy="28" r="3" fill="#4facfe" opacity="0.8"/>
  <circle cx="28" cy="100" r="3" fill="#00f2fe" opacity="0.8"/>
  <circle cx="100" cy="100" r="3" fill="#4facfe" opacity="0.8"/>

  <!-- Hexagon Outer Border -->
  <polygon points="64,28 98,47 98,85 64,104 30,85 30,47" fill="url(#nexusGrad)" filter="url(#nexusGlow)"/>
  <!-- Hexagon Inner Cutout -->
  <polygon points="64,34 92,50 92,82 64,98 36,82 36,50" fill="#050b14"/>

  <!-- Central Nexus 'N' Core Glyph -->
  <path d="M48 78 V48 L76 78 V48" stroke="url(#nexusGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Pulse Node Dots -->
  <circle cx="84" cy="44" r="4" fill="#00f2fe" />
  <circle cx="44" cy="82" r="3" fill="#4facfe" />
</svg>
