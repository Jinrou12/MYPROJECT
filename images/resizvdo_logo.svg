<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Video file icon -->
  <rect x="100" y="90" width="200" height="250" rx="16" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
  <!-- Folded corner -->
  <polygon points="260,90 300,130 260,130" fill="rgba(255,255,255,0.2)"/>
  <!-- Video play in file -->
  <circle cx="200" cy="220" r="50" fill="rgba(56,189,248,0.3)"/>
  <polygon points="185,198 185,242 228,220" fill="white"/>
  <!-- Arrow right (resize/convert) -->
  <path d="M315,220 L395,220" stroke="url(#arrow)" stroke-width="14" stroke-linecap="round"/>
  <polygon points="385,202 415,220 385,238" fill="#38bdf8"/>
  <!-- Output/target frame 16:9 -->
  <rect x="330" y="90" width="130" height="73" rx="8" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="4"/>
  <text x="395" y="135" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="14" fill="#38bdf8">1920×1080</text>
  <!-- Resize arrows -->
  <text x="256" y="400" text-anchor="middle" font-family="Arial" font-size="100" fill="rgba(56,189,248,0.4)">⇔</text>
  <text x="256" y="460" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="22" fill="rgba(255,255,255,0.5)">VIDEO RESIZER</text>
</svg>
