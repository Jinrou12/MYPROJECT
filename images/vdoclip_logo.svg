<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="vcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="vcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#vcGrad)" filter="url(#vcGlow)"/>
  <rect width="48" height="48" rx="12" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none"/>
  <!-- Movie Clapperboard -->
  <g transform="translate(10, 11)">
    <!-- Clap top sticks -->
    <path d="M2 9 L26 4 L25 0 L1 5 Z" fill="#0f172a" stroke="white" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Stripes on stick -->
    <polygon points="5,4.5 8,3.8 7,0.7 4,1.4" fill="white"/>
    <polygon points="12,3.1 15,2.4 14,-0.7 11,0.0" fill="white"/>
    <polygon points="19,1.7 22,1.0 21,-2.1 18,-1.4" fill="white"/>
    <!-- Lower Board -->
    <rect x="1.5" y="9" width="24.5" height="17" rx="3" fill="#0f172a" stroke="white" stroke-width="1.4"/>
    <!-- Play button in clapper -->
    <polygon points="11,13.5 11,21.5 18,17.5" fill="#38bdf8"/>
  </g>
</svg>
