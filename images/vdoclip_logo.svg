<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Film strip left bar -->
  <rect x="60" y="140" width="50" height="232" rx="10" fill="rgba(255,255,255,0.15)"/>
  <rect x="68" y="165" width="34" height="28" rx="5" fill="rgba(255,255,255,0.5)"/>
  <rect x="68" y="215" width="34" height="28" rx="5" fill="rgba(255,255,255,0.5)"/>
  <rect x="68" y="265" width="34" height="28" rx="5" fill="rgba(255,255,255,0.5)"/>
  <rect x="68" y="315" width="34" height="28" rx="5" fill="rgba(255,255,255,0.5)"/>
  <!-- Film strip right bar -->
  <rect x="402" y="140" width="50" height="232" rx="10" fill="rgba(255,255,255,0.15)"/>
  <rect x="410" y="165" width="34" height="28" rx="5" fill="rgba(255,255,255,0.5)"/>
  <rect x="410" y="215" width="34" height="28" rx="5" fill="rgba(255,255,255,0.5)"/>
  <rect x="410" y="265" width="34" height="28" rx="5" fill="rgba(255,255,255,0.5)"/>
  <rect x="410" y="315" width="34" height="28" rx="5" fill="rgba(255,255,255,0.5)"/>
  <!-- Screen -->
  <rect x="120" y="150" width="272" height="180" rx="16" fill="rgba(0,0,0,0.4)"/>
  <!-- Play button -->
  <circle cx="256" cy="240" r="52" fill="url(#btn)"/>
  <polygon points="244,218 244,262 284,240" fill="white"/>
  <!-- Scissors / cut icon -->
  <circle cx="180" cy="380" r="22" fill="none" stroke="white" stroke-width="10"/>
  <circle cx="240" cy="380" r="22" fill="none" stroke="white" stroke-width="10"/>
  <line x1="195" y1="367" x2="340" y2="310" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <line x1="195" y1="393" x2="340" y2="450" stroke="white" stroke-width="9" stroke-linecap="round"/>
</svg>
