<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Poster/paper stack -->
  <rect x="180" y="100" width="200" height="260" rx="12" fill="rgba(255,255,255,0.1)" transform="rotate(-8,256,230)"/>
  <rect x="155" y="110" width="200" height="260" rx="12" fill="rgba(255,255,255,0.15)" transform="rotate(-4,256,240)"/>
  <!-- Main poster -->
  <rect x="130" y="120" width="200" height="260" rx="12" fill="white"/>
  <!-- Lines on poster -->
  <rect x="150" y="150" width="160" height="16" rx="4" fill="#b91c1c" opacity="0.7"/>
  <rect x="150" y="180" width="120" height="10" rx="3" fill="#888"/>
  <rect x="150" y="200" width="140" height="10" rx="3" fill="#888"/>
  <rect x="150" y="220" width="100" height="10" rx="3" fill="#888"/>
  <!-- Photo placeholder on poster -->
  <rect x="150" y="242" width="160" height="80" rx="6" fill="#f0e6e6"/>
  <circle cx="190" cy="270" r="22" fill="#d1a0a0"/>
  <!-- Excel/data icon -->
  <rect x="320" y="280" width="90" height="110" rx="12" fill="#16a34a"/>
  <text x="365" y="350" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="52" fill="white">E</text>
  <!-- Arrow between -->
  <path d="M295 290 L320 290" stroke="white" stroke-width="8" stroke-linecap="round" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="white"/>
    </marker>
  </defs>
</svg>
