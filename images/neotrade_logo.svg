<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Chart bars -->
  <rect x="80" y="310" width="60" height="120" rx="8" fill="url(#bar1)"/>
  <rect x="155" y="230" width="60" height="200" rx="8" fill="url(#bar2)"/>
  <rect x="230" y="180" width="60" height="250" rx="8" fill="url(#bar1)"/>
  <!-- Trend line -->
  <polyline points="110,310 185,250 260,200 340,160 420,120" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dots on trend line -->
  <circle cx="110" cy="310" r="10" fill="#f59e0b"/>
  <circle cx="185" cy="250" r="10" fill="#f59e0b"/>
  <circle cx="260" cy="200" r="10" fill="#f59e0b"/>
  <circle cx="340" cy="160" r="10" fill="#f59e0b"/>
  <circle cx="420" cy="120" r="10" fill="#f59e0b"/>
  <!-- Bitcoin coin -->
  <circle cx="390" cy="370" r="75" fill="url(#coin)"/>
  <circle cx="390" cy="370" r="62" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6"/>
  <text x="390" y="398" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="70" fill="white">₿</text>
</svg>
